name = "prism-featherless"
main = "worker.mjs"
compatibility_date = "2026-10-01"
# Forge reaches it at https://prism-featherless.<account>.workers.dev/v1/chat/completions
# (RELAY in studio/shell/inference-effects.mjs).
workers_dev = true
preview_urls = false

[vars]
# The pages that may use the relay, exactly as a browser sends Origin.
ALLOWED_ORIGINS = "https://uor-foundation.github.io"
# The models Forge offers through the site's key (FEATHERLESS_MODELS in studio/shell/host.js).
# GLM 5.3 Flash stays listed only until the deployed site, which still asks for it, is replaced by one
# that asks for Qwen3 30B; then it comes off this list.
MODELS = "Qwen/Qwen3-30B-A3B-Instruct-2507,zai-org/GLM-5.3-Flash"
# The most a single answer may write (Forge asks for 32,768: GLM reasons before it answers).
MAX_TOKENS = "32768"

# A response schema (the prism/spec/1 shape, on a new app's first turn) is forwarded only while this is "1"
# (README, "What it forwards"). Both models honoured it when measured on 2026-11-13.
FORWARD_RESPONSE_FORMAT = "1"

# Each visitor (by address) may send this many requests a minute.
[[ratelimits]]
name = "PER_VISITOR"
namespace_id = "1001"

  [ratelimits.simple]
  limit = 20
  period = 60

# The key itself is a secret, never in this file: wrangler secret put FEATHERLESS_KEY
